name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check Python lockfile
        run: uv lock --check

      - name: Build PyPI wheel
        env:
          ARU_BUILD_DISTRIBUTION: pypi
        run: uv build --wheel --out-dir dist

      - name: Verify uv tool installation
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          UV_TOOL_DIR="$PWD/.uv-tools" UV_TOOL_BIN_DIR="$PWD/.uv-bin" \
            uv tool install "$wheel"
          executable="$PWD/.uv-bin/aru"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            executable="${executable}.exe"
          fi
          "$executable" --version
          if output="$("$executable" --offline self update 2>&1)"; then
            echo "Package-manager wheel unexpectedly allowed self-update" >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep --fixed-strings "uv tool upgrade arust"
