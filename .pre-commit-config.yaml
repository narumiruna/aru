repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types_or: [rust, toml]
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        types_or: [rust, toml]
      - id: cargo-test
        name: cargo test
        entry: cargo test --all-targets --all-features
        language: system
        pass_filenames: false
        stages: [pre-push]
        types_or: [rust, toml]
      - id: aru-sync
        name: aru sync
        entry: cargo run --locked -- sync
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
