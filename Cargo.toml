[package]
name = "aru"
version = "0.0.11"
edition = "2024"
description = "A project manager for coding-agent instructions, skills, and MCP servers, written in Rust."
repository = "https://github.com/narumiruna/aru"
license = "MIT"
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/LICENSE",
  "/README.md",
  "/docs/formats.md",
  "/docs/spikes/**",
  "/src/**",
  "/tests/*.rs",
  "/tests/fixtures/**",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dirs = "6.0.0"
flate2 = "1.1"
fs2 = "0.4"
globset = "0.4.16"
hex = "0.4"
inquire = { version = "0.9.4", default-features = false, features = [
  "crossterm",
  "fuzzy"
] }
jsonc-parser = { version = "0.33.1", features = ["cst", "serde_json"] }
libc = "0.2"
percent-encoding = "2.3"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "json",
  "rustls"
] }
self-replace = "1.5.0"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.11"
tar = "0.4"
tempfile = "3.20"
thiserror = "2.0"
toml = "1.1"
toml_edit = { version = "0.25.13", features = ["serde"] }
unicode-normalization = "0.1.25"
url = "2.5"
walkdir = "2.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading"
] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[target."cfg(unix)".dev-dependencies]
expectrl = "0.9"
