[package]
name = "aru"
version = "0.0.3"
edition = "2024"
description = "A project manager for coding-agent instructions, skills, and MCP servers, written in Rust."
repository = "https://github.com/narumiruna/aru"
license = "MIT"
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/LICENSE",
  "/README.md",
  "/docs/formats.md",
  "/docs/spikes/**",
  "/src/**",
  "/tests/cli.rs",
  "/tests/cli_policy.rs",
  "/tests/instruction_cli.rs",
  "/tests/interactive_cli.rs",
  "/tests/mcp_cli.rs",
  "/tests/target_cli.rs",
  "/tests/fixtures/**",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
globset = "0.4.16"
hex = "0.4"
inquire = { version = "0.9.4", default-features = false, features = [
  "crossterm",
  "fuzzy"
] }
percent-encoding = "2.3"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "json",
  "rustls"
] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.11"
tempfile = "3.20"
thiserror = "2.0"
toml = "1.1"
toml_edit = { version = "0.25.13", features = ["serde"] }
url = "2.5"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[target."cfg(unix)".dev-dependencies]
expectrl = "0.9"
