site_name: aru
site_description: Reproducible project management for coding-agent instructions, skills, and MCP servers.
site_url: https://narumiruna.github.io/aru/
repo_url: https://github.com/narumiruna/aru
repo_name: narumiruna/aru
edit_uri: edit/main/docs/public/
copyright: Copyright &copy; 2026 aru contributors

strict: true
docs_dir: docs/public
site_dir: site

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Core workflows:
      - Native packages: packages.md
      - Plugin dependencies: plugins.md
      - Instructions: instructions.md
      - Agent Skills: skills.md
      - MCP servers: mcp.md
      - Lock and sync: sync.md
  - Reference:
      - Command reference: reference/commands.md
      - Project files and targets: reference/project-files.md
      - Skill targets: reference/skill-targets.md
      - Safety and recovery: safety.md

theme:
  name: material
  language: en
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/narumiruna/aru
      name: aru on GitHub
    - icon: fontawesome/brands/rust
      link: https://crates.io/crates/aru
      name: aru on crates.io
